[project]
name = "face_checkin"
authors = [
    { name = "Pupa" }
]
description = "Check-in with selfie and geolocation for Frappe HR"
requires-python = ">=3.11"
readme = "README.md"
dynamic = ["version"]
dependencies = ["boto3"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0-dev,<=17.0.0-dev"
